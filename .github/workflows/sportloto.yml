name: Sportloto analytics
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "reports/**"
concurrency:
  group: sportloto-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh recent draws from official Stoloto
        run: |
          BEFORE="$(sha256sum data/results.csv 2>/dev/null | awk '{print $1}')"
          python scripts/fetch_stoloto.py
          AFTER="$(sha256sum data/results.csv | awk '{print $1}')"
          echo "BEFORE=$BEFORE"
          echo "AFTER=$AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "DATA_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "DATA_CHANGED=false" >> "$GITHUB_ENV"
          fi
      - name: Decide whether analysis is needed
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$DATA_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.changed == 'true'
        with:
          name: sportloto-data
          path: data/results.csv

  batch:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: baseline
            strategies: RANDOM,HOT,COLD,RECENT30
          - name: structural
            strategies: MOMENTUM,GAP,SELFLAG
          - name: pairwise
            strategies: CROSSLAG,PAIRS
          - name: learned
            strategies: LEARNED,LEARNED_EWMA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download prepared dataset
        uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - name: Run isolated model batch
        env:
          SKIP_LOAD: "1"
          STRATEGIES: ${{ matrix.strategies }}
          BATCH_NAME: ${{ matrix.name }}
          BATCH_OUT: reports/batch_${{ matrix.name }}.json
        run: python scripts/run_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-batch-${{ matrix.name }}
          path: reports/batch_${{ matrix.name }}.json

  validation:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - name: Independent SELFLAG rolling validation
        run: python scripts/validate_selflag.py
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-selflag-validation
          path: reports/selflag_validation.md

  aggregate:
    needs: [prepare, batch]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - uses: actions/download-artifact@v5
        with:
          pattern: sportloto-batch-*
          path: reports
          merge-multiple: true
      - name: Aggregate batches
        run: python scripts/aggregate_batches.py
      - name: Commit updated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv reports/latest.md reports/signals.md
          git diff --cached --quiet || git commit -m "chore: update full-history Sportloto analysis"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-full-report
          path: |
            reports/latest.md
            reports/signals.md
            data/results.csv
