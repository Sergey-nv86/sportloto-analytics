name: Sportloto analytics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "reports/**"
concurrency:
  group: sportloto-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare full-history dataset
        run: python scripts/prepare_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-data
          path: data/results.csv
  batch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: baseline
            strategies: RANDOM,HOT,COLD,RECENT30
          - name: structural
            strategies: MOMENTUM,GAP,SELFLAG
          - name: pairwise
            strategies: CROSSLAG,PAIRS
          - name: learned
            strategies: LEARNED,LEARNED_EWMA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download prepared dataset
        uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - name: Run isolated model batch
        env:
          SKIP_LOAD: "1"
          STRATEGIES: ${{ matrix.strategies }}
          BATCH_NAME: ${{ matrix.name }}
          BATCH_OUT: reports/batch_${{ matrix.name }}.json
        run: python scripts/run_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-batch-${{ matrix.name }}
          path: reports/batch_${{ matrix.name }}.json
  validation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - name: Independent SELFLAG rolling validation
        run: python scripts/validate_selflag.py
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-selflag-validation
          path: reports/selflag_validation.md
  aggregate:
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: sportloto-data
          path: data
      - uses: actions/download-artifact@v5
        with:
          pattern: sportloto-batch-*
          path: reports
          merge-multiple: true
      - name: Aggregate batches
        run: python scripts/aggregate_batches.py
      - name: Commit updated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv reports/latest.md reports/signals.md
          git diff --cached --quiet || git commit -m "chore: update full-history Sportloto analysis"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: sportloto-full-report
          path: |
            reports/latest.md
            reports/signals.md
            data/results.csv
