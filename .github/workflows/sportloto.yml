name: Sportloto analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "reports/**"
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full-history statistical pipeline
        run: python scripts/run_analysis.py
      - name: Commit updated data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv reports/latest.md reports/signals.md
          git diff --cached --quiet || git commit -m "chore: update full-history Sportloto analysis"
          git push
      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: sportloto-full-report
          path: |
            reports/latest.md
            reports/signals.md
            data/results.csv
